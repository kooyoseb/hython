[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "hython-lang"
version = "2.0.0"
description = "Python, pronounced in Hangul"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hython contributors" }]
keywords = ["python", "korean", "esoteric-language", "compiler", "virtual-machine"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Compilers",
]

[project.scripts]
hython = "hython.cli:entrypoint"

[project.optional-dependencies]
exe = ["pyinstaller>=6.16"]
native = ["nuitka>=2.8", "ordered-set>=4.1", "zstandard>=0.23"]
publish = ["build>=1.3", "twine>=6.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
